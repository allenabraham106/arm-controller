arm_inner:
  ros__parameters:
    # Planning
    planning_group: "panda_arm"
    planning_time: 15.0
    
    # Workspace bounds (derived from Franka datasheet 855mm reach)
    workspace:
      x_min: -0.855
      x_max: 0.855
      y_min: -0.855
      y_max: 0.855
      z_min: 0.0
      z_max: 1.2
    
    # Collision box
    collision_box:
      x: 0.5
      y: 0.0
      z: 0.1
      size_x: 0.1
      size_y: 0.4
      size_z: 0.4